# Workflow name - displayed in GitHub Actions UI
name: Playwright Tests

# Trigger conditions - when should this workflow run?
on:
  # Run on push events to these branches
  push:
    branches: [main, develop, test/ai-review]
  # Run on pull requests targeting these branches
  pull_request:
    branches: [main, develop]

# Jobs define the actual work to be done
jobs:
  # Job name: 'test' - you can have multiple jobs in a workflow
  test:
    # Maximum time this job can run before GitHub cancels it
    timeout-minutes: 10
    # Operating system to run the job on (ubuntu-latest is free for public repos)
    runs-on: ubuntu-latest

    # Steps are executed sequentially in the order defined
    steps:
      # Step 1: Clone the repository code into the runner environment
      # uses: references a reusable action from GitHub Marketplace
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js runtime
      # Required because Playwright is a Node.js tool
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Specify Node.js version (match your local development version)
          node-version: '20'

      # Step 3: Install npm dependencies from package.json
      # npm ci is faster and more reliable than npm install for CI/CD
      # It installs exact versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Download and install browser binaries
      # --with-deps installs system dependencies needed by browsers
      # This includes Chromium, Firefox, and WebKit
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Step 5: Execute the Playwright test suite
      # Uses configuration from playwright.config.ts
      - name: Run Playwright tests
        run: npx playwright test

      # Step 6: Upload HTML report if tests fail
      # if: failure() means this step only runs when previous steps fail
      # Artifacts are stored for 7 days and can be downloaded from GitHub Actions UI
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Name of the artifact in GitHub UI
          name: playwright-report
          # Path to the report directory (configured in playwright.config.ts)
          path: playwright-report/
          # How long GitHub keeps the artifact before deleting it
          retention-days: 7
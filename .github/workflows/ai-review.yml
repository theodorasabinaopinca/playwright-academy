# AI reviews test files for bad practices and suggests improvements
name: AI Code Review

# When to run: PRs that modify test or page files
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - 'tests/**/*.spec.ts'
      - 'pages/**/*.ts'

# Permissions needed to comment on PRs
permissions:
  pull-requests: write  # Post comments
  contents: read        # Read code

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Get the code with full history to compare changes
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install project dependencies + AI SDK packages
      - name: Install dependencies
        run: |
          npm ci
          npm install @anthropic-ai/sdk @octokit/rest

      # Find which test files changed in this PR
      - name: Get changed test files
        id: changed-files
        run: |
          git fetch origin ${{ github.base_ref }}
          changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(spec|test)\.ts$' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$changed_files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Changed test files:"
          echo "$changed_files"

      # Send changed files to Claude for review
      # Only runs if test files were changed
      - name: Run AI code review
        if: steps.changed-files.outputs.files != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: node scripts/ai-review.js

      # Post a message if no test files were changed
      - name: Comment on PR
        if: steps.changed-files.outputs.files == ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'No test files changed - skipping AI review.'
            })